<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Produtos</title>
</head>
<body>
    <h1>Teste de Produtos no localStorage</h1>
    <div id="resultado"></div>

    <script>
        // Verificar produtos
        const produtos = JSON.parse(localStorage.getItem('produtos_cadastrados') || '[]');
        const fornecedores = JSON.parse(localStorage.getItem('fornecedores') || '[]');
        
        console.log('Produtos encontrados:', produtos);
        console.log('Fornecedores encontrados:', fornecedores);
        
        document.getElementById('resultado').innerHTML = `
            <h2>Produtos (${produtos.length})</h2>
            <pre>${JSON.stringify(produtos, null, 2)}</pre>
            
            <h2>Fornecedores (${fornecedores.length})</h2>
            <pre>${JSON.stringify(fornecedores, null, 2)}</pre>
        `;
    </script>
</body>
</html>
