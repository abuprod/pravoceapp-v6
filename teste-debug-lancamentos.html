<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Lançamentos de Pedido de Venda</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
        pre { background-color: #f8f9fa; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .produto-item { background-color: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 4px; }
        .local-se { background-color: #fff3cd; }
        .local-normal { background-color: #d1ecf1; }
        .debug-section { background-color: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔍 Debug - Lançamentos de Pedido de Venda</h1>
    
    <div class="card info">
        <h3>📋 Objetivo do Debug</h3>
        <p>Identificar exatamente onde está o problema na criação dos lançamentos do histórico.</p>
    </div>

    <div class="card">
        <h3>🚀 Testes de Debug</h3>
        <button class="btn-primary" onclick="testeIteracaoProdutos()">Teste 1: Iteração de Produtos</button>
        <button class="btn-success" onclick="testeFiltroSE()">Teste 2: Filtro SE</button>
        <button class="btn-warning" onclick="testeValidacoes()">Teste 3: Validações</button>
        <button class="btn-danger" onclick="limparDados()">Limpar Dados</button>
    </div>

    <div class="card">
        <h3>📊 Dados de Teste</h3>
        <div id="dadosTeste"></div>
    </div>

    <div class="card">
        <h3>🔍 Resultados dos Testes</h3>
        <div id="resultadosTestes"></div>
    </div>

    <div class="card">
        <h3>📝 Histórico de Lançamentos</h3>
        <div id="historicoLancamentos"></div>
    </div>

    <div class="card">
        <h3>🔍 Logs de Debug</h3>
        <div id="logsDebug"></div>
    </div>

    <script>
        // Dados de teste
        const produtosTeste = [
            {
                id: 1,
                descricao: "Produto A - Teste",
                fornecedor: "Fornecedor Teste",
                estoque: {
                    "DEP": { quantidade: 100, observacao: "" },
                    "LOJA": { quantidade: 50, observacao: "" }
                },
                estoqueDisponivel: 150,
                estoqueFisico: 150
            },
            {
                id: 2,
                descricao: "Produto B - Teste",
                fornecedor: "Fornecedor Teste",
                estoque: {
                    "DEP": { quantidade: 75, observacao: "" },
                    "LOJA": { quantidade: 25, observacao: "" }
                },
                estoqueDisponivel: 100,
                estoqueFisico: 100
            },
            {
                id: 3,
                descricao: "Produto C - SE",
                fornecedor: "Fornecedor Teste",
                estoque: {
                    "SE": { quantidade: 0, observacao: "" }
                },
                estoqueDisponivel: 0,
                estoqueFisico: 0
            }
        ];

        const pedidoTeste = {
            numeroPedido: "PV001",
            produtos: [
                {
                    produtoId: 1,
                    produto: "Produto A - Teste",
                    sl: "DEP",
                    quantidade: 10
                },
                {
                    produtoId: 2,
                    produto: "Produto B - Teste",
                    sl: "LOJA",
                    quantidade: 5
                },
                {
                    produtoId: 3,
                    produto: "Produto C - SE",
                    sl: "SE",
                    quantidade: 15
                }
            ]
        };

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logsDebug');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }

        function mostrarDadosTeste() {
            const dadosDiv = document.getElementById('dadosTeste');
            let html = '<h4>Produtos do Pedido:</h4>';
            
            pedidoTeste.produtos.forEach((produto, index) => {
                const classeLocal = produto.sl === 'SE' ? 'local-se' : 'local-normal';
                html += `<div class="produto-item ${classeLocal}">`;
                html += `<strong>Produto ${index + 1}:</strong> ${produto.produto}<br>`;
                html += `<strong>Local:</strong> ${produto.sl}<br>`;
                html += `<strong>Quantidade:</strong> ${produto.quantidade}<br>`;
                html += `<strong>ID:</strong> ${produto.produtoId}`;
                html += '</div>';
            });
            
            dadosDiv.innerHTML = html;
        }

        function testeIteracaoProdutos() {
            log('🧪 TESTE 1: Verificando iteração de produtos...', 'info');
            
            const resultadosDiv = document.getElementById('resultadosTestes');
            let html = '<div class="debug-section">';
            html += '<h4>🧪 Teste 1: Iteração de Produtos</h4>';
            
            let produtosProcessados = 0;
            let produtosPulados = 0;
            let produtosComBaixa = 0;
            
            for (const produtoPedido of pedidoTeste.produtos) {
                html += `<p><strong>Processando:</strong> ${produtoPedido.produto} (${produtoPedido.sl})</p>`;
                
                // Pular produtos "SE" (sob encomenda)
                if (produtoPedido.sl === 'SE') {
                    html += `<p style="color: orange;">⏭️ PULADO - Produto SE</p>`;
                    produtosPulados++;
                    continue;
                }
                
                // Verificar se o produto tem ID válido
                if (!produtoPedido.produtoId) {
                    html += `<p style="color: red;">❌ PULADO - Sem ID válido</p>`;
                    produtosPulados++;
                    continue;
                }
                
                // Verificar se o produto tem local válido
                if (!produtoPedido.sl) {
                    html += `<p style="color: red;">❌ PULADO - Sem local válido</p>`;
                    produtosPulados++;
                    continue;
                }
                
                // Encontrar o produto cadastrado
                const produtoCadastrado = produtosTeste.find(p => p.id === produtoPedido.produtoId);
                
                if (!produtoCadastrado) {
                    html += `<p style="color: red;">❌ PULADO - Produto não encontrado no cadastro</p>`;
                    produtosPulados++;
                    continue;
                }
                
                html += `<p style="color: green;">✅ PROCESSADO - Produto encontrado e válido</p>`;
                produtosProcessados++;
                produtosComBaixa++;
            }
            
            html += `<hr><p><strong>RESUMO:</strong></p>`;
            html += `<p>• Total de produtos: ${pedidoTeste.produtos.length}</p>`;
            html += `<p>• Produtos processados: ${produtosProcessados}</p>`;
            html += `<p>• Produtos pulados: ${produtosPulados}</p>`;
            html += `<p>• Produtos com baixa: ${produtosComBaixa}</p>`;
            html += '</div>';
            
            resultadosDiv.innerHTML = html;
            log(`🧪 Teste 1 concluído: ${produtosComBaixa} produtos devem ter baixa`);
        }

        function testeFiltroSE() {
            log('🧪 TESTE 2: Verificando filtro SE...', 'info');
            
            const resultadosDiv = document.getElementById('resultadosTestes');
            let html = '<div class="debug-section">';
            html += '<h4>🧪 Teste 2: Filtro SE</h4>';
            
            const produtosSE = pedidoTeste.produtos.filter(p => p.sl === 'SE');
            const produtosNormais = pedidoTeste.produtos.filter(p => p.sl !== 'SE');
            
            html += `<p><strong>Produtos SE (sob encomenda):</strong> ${produtosSE.length}</p>`;
            produtosSE.forEach(p => {
                html += `<p style="color: orange;">• ${p.produto} (${p.sl}) - Qtd: ${p.quantidade}</p>`;
            });
            
            html += `<p><strong>Produtos normais:</strong> ${produtosNormais.length}</p>`;
            produtosNormais.forEach(p => {
                html += `<p style="color: green;">• ${p.produto} (${p.sl}) - Qtd: ${p.quantidade}</p>`;
            });
            
            html += '</div>';
            
            resultadosDiv.innerHTML += html;
            log(`🧪 Teste 2 concluído: ${produtosNormais.length} produtos devem ter baixa`);
        }

        function testeValidacoes() {
            log('🧪 TESTE 3: Verificando validações...', 'info');
            
            const resultadosDiv = document.getElementById('resultadosTestes');
            let html = '<div class="debug-section">';
            html += '<h4>🧪 Teste 3: Validações</h4>';
            
            const produtosInvalidos = pedidoTeste.produtos.filter(produto => {
                return !produto.produto || !produto.sl || !produto.quantidade || !produto.produtoId;
            });
            
            if (produtosInvalidos.length > 0) {
                html += `<p style="color: red;"><strong>❌ Produtos com dados incompletos:</strong></p>`;
                produtosInvalidos.forEach(p => {
                    html += `<p style="color: red;">• ${p.produto || 'Produto sem nome'} - Local: ${p.sl || 'Não informado'} - Quantidade: ${p.quantidade || 'Não informada'} - ID: ${p.produtoId || 'Não informado'}</p>`;
                });
            } else {
                html += `<p style="color: green;"><strong>✅ Todos os produtos têm dados válidos</strong></p>`;
            }
            
            // Verificar se há produtos com local SE e produtos normais
            const produtosSE = pedidoTeste.produtos.filter(p => p.sl === 'SE');
            const produtosNormais = pedidoTeste.produtos.filter(p => p.sl !== 'SE');
            
            html += `<p><strong>Produtos SE (sob encomenda):</strong> ${produtosSE.length}</p>`;
            html += `<p><strong>Produtos normais:</strong> ${produtosNormais.length}</p>`;
            
            // Determinar se deve dar baixa imediata
            const produtosComBaixa = pedidoTeste.produtos.filter(p => p.sl !== 'SE');
            const deveDarBaixaImediata = produtosComBaixa.length > 0;
            
            html += `<p><strong>Deve dar baixa imediata:</strong> ${deveDarBaixaImediata ? 'SIM' : 'NÃO'}</p>`;
            if (deveDarBaixaImediata) {
                html += `<p><strong>Produtos que devem ter baixa:</strong> ${produtosComBaixa.length}</p>`;
                produtosComBaixa.forEach(p => {
                    html += `<p>• ${p.produto} (${p.sl}) - ID: ${p.produtoId} - Qtd: ${p.quantidade}</p>`;
                });
            }
            
            html += '</div>';
            
            resultadosDiv.innerHTML += html;
            log(`🧪 Teste 3 concluído: ${produtosComBaixa.length} produtos devem ter baixa`);
        }

        function verificarHistorico() {
            const historico = JSON.parse(localStorage.getItem('historicoLancamentos') || '[]');
            const historicoDiv = document.getElementById('historicoLancamentos');
            
            if (historico.length === 0) {
                historicoDiv.innerHTML = '<p>Nenhum lançamento encontrado no histórico.</p>';
                return;
            }
            
            let html = `<h4>Total de lançamentos: ${historico.length}</h4>`;
            html += '<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">';
            html += '<tr style="background-color: #f8f9fa;">';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Data</th>';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Hora</th>';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Tipo</th>';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Produto</th>';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Quantidade</th>';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Local</th>';
            html += '<th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Observação</th>';
            html += '</tr>';
            
            historico.forEach(lancamento => {
                html += '<tr>';
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.data}</td>`;
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.hora}</td>`;
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.tipo}</td>`;
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.descricao}</td>`;
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.quantidade}</td>`;
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.local}</td>`;
                html += `<td style="border: 1px solid #ddd; padding: 8px;">${lancamento.observacao}</td>`;
                html += '</tr>';
            });
            
            html += '</table>';
            historicoDiv.innerHTML = html;
        }

        function limparDados() {
            localStorage.removeItem('historicoLancamentos');
            localStorage.removeItem('produtos_cadastrados');
            document.getElementById('historicoLancamentos').innerHTML = '<p>Dados limpos.</p>';
            document.getElementById('resultadosTestes').innerHTML = '';
            document.getElementById('logsDebug').innerHTML = '';
            log('🧹 Dados limpos com sucesso');
        }

        // Inicializar
        window.onload = function() {
            log('🚀 Debug de Lançamentos de Pedido de Venda iniciado');
            mostrarDadosTeste();
            verificarHistorico();
        };
    </script>
</body>
</html>
